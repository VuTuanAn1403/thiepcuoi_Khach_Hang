services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: thiepcuoi_app
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=wedding_db
      - DB_USER=root
      - DB_PASS=rootpassword
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: thiepcuoi_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wedding_db
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./wedding_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
